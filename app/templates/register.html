{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h2 class="mb-1">Criar conta</h2>
                <p class="text-muted mb-4">Cadastre sua empresa e seu usuário</p>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Empresa</label>
                        <input type="text" name="company_name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="cnpj" class="form-label">CNPJ da empresa</label>
                        <input type="text" class="form-control" id="cnpj" name="cnpj" maxlength="18">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="cpf" class="form-label">CPF</label>
                        <input type="text" class="form-control" id="cpf" name="cpf" maxlength="14">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>

                    <div class="text-center">
                        <a href="{{ url_for('auth.login') }}">Já tenho conta</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
