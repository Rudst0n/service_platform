{% extends "base.html" %}

{% block title %}Editar serviço | ServHub{% endblock %}

{% block content %}
<section class="customer-form-page">
    <div class="customer-form-wrapper">
        <div class="customer-form-header">
            <div>
                <h2 class="page-title mb-1">Editar serviço</h2>
                <p class="page-subtitle mb-0">Atualize as informações do serviço</p>
            </div>

            <a href="{{ url_for('services.list_services') }}" class="btn btn-outline-secondary customer-back-btn">
                Voltar
            </a>
        </div>

        <div class="card border-0 shadow-sm customer-form-card">
            <div class="card-body">
                <form method="POST" class="customer-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3">
                        <div class="col-12">
                            <label for="name" class="form-label">Nome do serviço</label>
                            <input
                                type="text"
                                name="name"
                                id="name"
                                class="form-control customer-input"
                                value="{{ form_data.name if form_data else service.name }}"
                                required
                            >
                        </div>

                        <div class="col-12">
                            <label for="customer_id" class="form-label">Cliente</label>
                            <select
                                name="customer_id"
                                id="customer_id"
                                class="form-select customer-input"
                                required
                            >
                                <option value="">Selecione um cliente</option>
                                {% for customer in customers %}
                                    {% set selected_customer_id = form_data.customer_id if form_data else service.customer_id %}
                                    <option
                                        value="{{ customer.id }}"
                                        {% if selected_customer_id == customer.id %}selected{% endif %}
                                    >
                                        {{ customer.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="customer-form-actions">
                        <a href="{{ url_for('services.list_services') }}" class="btn btn-outline-secondary customer-cancel-btn">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary customer-save-btn">
                            Salvar alterações
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
