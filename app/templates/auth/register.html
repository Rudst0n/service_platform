{% extends "base.html" %}

{% block title %}Criar conta | ServHub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2 class="auth-title">Criar conta</h2>
                <p class="auth-subtitle">Cadastre sua empresa e comece a usar a plataforma</p>
            </div>

            <form method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Nome da empresa</label>
                    <input
                        type="text"
                        name="company_name"
                        class="form-control auth-input"
                        placeholder="Digite o nome da empresa"
                        value="{{ request.form.get('company_name', '') }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Seu nome</label>
                    <input
                        type="text"
                        name="name"
                        class="form-control auth-input"
                        placeholder="Digite seu nome"
                        value="{{ request.form.get('name', '') }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control auth-input"
                        placeholder="Digite seu e-mail"
                        value="{{ request.form.get('email', '') }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control auth-input"
                        placeholder="Crie uma senha"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirmar senha</label>
                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control auth-input"
                        placeholder="Repita a senha"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100 auth-btn">
                    Criar conta
                </button>
            </form>

            <div class="auth-footer">
                <p class="mb-0">
                    Já tem conta?
                    <a href="{{ url_for('auth.login') }}" class="auth-link">
                        Entrar
                    </a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
