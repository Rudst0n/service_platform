{% extends "base.html" %}

{% block title %}Entrar | ServHub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-container">

        <div class="auth-card">
            <div class="auth-header">
                <h2 class="auth-title">Entrar na plataforma</h2>
                <p class="auth-subtitle">Acesse sua conta para continuar</p>
            </div>

            <form method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="login" class="form-label">E-mail ou CPF</label>
                    <input
                        type="text"
                        name="login"
                        id="login"
                        class="form-control auth-input"
                        placeholder="Digite seu e-mail ou CPF"
                        value="{{ request.form.get('login', '') }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Senha</label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control auth-input"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <a href="{{ url_for('auth.forgot_password') }}" class="auth-link">
                        Esqueci minha senha
                    </a>
                </div>

                <button type="submit" class="btn btn-primary w-100 auth-btn">
                    Entrar
                </button>
            </form>

            <div class="auth-footer">
                <p class="mb-0">
                    Não tem conta?
                    <a href="{{ url_for('auth.register') }}" class="auth-link">
                        Criar conta
                    </a>
                </p>
            </div>
        </div>

    </div>
</section>
{% endblock %}

{% block page_scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}?v=3"></script>
{% endblock %}
