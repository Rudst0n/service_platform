{% extends "base.html" %}

{% block title %}Nova senha | {{ app_name }}{% endblock %}

{% block content %}
<section class="auth-page-section">
    <div class="container-fluid px-0">
        <div class="row g-0 auth-shell overflow-hidden">
            <div class="col-12 col-lg-5 auth-brand-column">
                <div class="auth-brand-panel">
                    <span class="auth-badge">Nova senha</span>
                    <h1 class="auth-brand-title">Cadastre sua nova senha</h1>
                    <p class="auth-brand-text">Use uma senha forte para continuar com mais segurança.</p>
                </div>
            </div>
            <div class="col-12 col-lg-7">
                <div class="auth-form-wrapper">
                    <div class="auth-form-panel">
                        <div class="auth-form-header">
                            <h2>Redefinir senha</h2>
                            <p class="text-muted mb-0">Preencha os campos abaixo.</p>
                        </div>
                        <form method="POST" class="auth-form">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="mb-3">
                                <label class="form-label">Nova senha</label>
                                <input type="password" name="password" class="form-control auth-input" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Confirmar nova senha</label>
                                <input type="password" name="confirm_password" class="form-control auth-input" required>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary auth-submit-btn">Salvar nova senha</button>
                            </div>
                            <div class="auth-form-footer text-center">
                                <a href="{{ url_for('auth.login') }}" class="auth-link">Voltar para login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
