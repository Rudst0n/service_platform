{% extends "base.html" %}

{% block title %}Portal do Cliente | ServHub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-container">

        <div class="auth-card">
            <div class="auth-header">
                <h2 class="auth-title">Portal do Cliente</h2>
                <p class="auth-subtitle">Acompanhe seus serviços e solicitações</p>
            </div>

            <form method="POST" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control auth-input"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control auth-input"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100 auth-btn">
                    Entrar
                </button>
            </form>
        </div>

    </div>
</section>
{% endblock %}
