{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h2 class="mb-1">Editar funcionário</h2>
        <p class="text-muted mb-0">Atualize os dados do funcionário</p>
    </div>
</div>

<div class="app-form-card">
    <div class="card-body">
        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Nome</label>
                    <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">CPF</label>
                    <input type="text" name="cpf" class="form-control" value="{{ user.cpf or '' }}">
                </div>

            </div>

            <div class="mt-4 d-flex gap-2">
                <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary">
                    Voltar
                </a>
                <button type="submit" class="btn btn-primary">
                    Salvar alterações
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
