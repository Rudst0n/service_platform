{% extends "base.html" %}

{% block title %}Novo funcionário | ServHub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/users.css') }}">
{% endblock %}

{% block content %}
<section class="user-form-page">
    <div class="user-form-wrapper">
        <div class="user-form-header">
            <div>
                <h2 class="page-title mb-1">Novo funcionário</h2>
                <p class="page-subtitle mb-0">Cadastre um novo funcionário para sua empresa</p>
            </div>

            <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary user-back-btn">
                Voltar
            </a>
        </div>

        <div class="card border-0 shadow-sm user-form-card">
            <div class="card-body">
                <form method="POST" class="user-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3">
                        <div class="col-12">
                            <label for="name" class="form-label">Nome</label>
                            <input
                                type="text"
                                name="name"
                                id="name"
                                class="form-control user-input"
                                value="{{ request.form.get('name', '') }}"
                                required
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label">E-mail</label>
                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control user-input"
                                value="{{ request.form.get('email', '') }}"
                                required
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="cpf" class="form-label">CPF</label>
                            <input
                                type="text"
                                name="cpf"
                                id="cpf"
                                class="form-control user-input"
                                placeholder="000.000.000-00"
                                maxlength="14"
                                inputmode="numeric"
                                autocomplete="off"
                                value="{{ request.form.get('cpf', '') }}"
                                oninput="formatCPF(this)"
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="company_role" class="form-label">Perfil</label>
                            <select name="company_role" id="company_role" class="form-select user-input" required>
                                <option value="funcionario" {% if request.form.get('company_role', 'funcionario') == 'funcionario' %}selected{% endif %}>Funcionário</option>
                                <option value="visualizador" {% if request.form.get('company_role') == 'visualizador' %}selected{% endif %}>Visualizador</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="password" class="form-label">Senha</label>
                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control user-input"
                                required
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="confirm_password" class="form-label">Confirmar senha</label>
                            <input
                                type="password"
                                name="confirm_password"
                                id="confirm_password"
                                class="form-control user-input"
                                required
                            >
                        </div>

                        <div class="col-12">
                            <div class="form-check mt-2 user-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    name="is_active"
                                    id="is_active"
                                    {% if request.method == 'GET' or request.form.get('is_active') == 'on' %}checked{% endif %}
                                >
                                <label class="form-check-label" for="is_active">
                                    Usuário ativo
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="user-form-actions">
                        <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary user-cancel-btn">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary user-save-btn">
                            Cadastrar funcionário
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block page_scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script>
function formatCPF(input) {
    let value = input.value.replace(/\D/g, "").slice(0, 11);
    value = value.replace(/^(\d{3})(\d)/, "$1.$2");
    value = value.replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3");
    value = value.replace(/\.(\d{3})(\d)/, ".$1-$2");
    input.value = value;
}
</script>
{% endblock %}
