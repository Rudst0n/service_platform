{% extends "base.html" %}

{% block title %}Editar cliente | ServHub{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/customers.css') }}">
{% endblock %}


{% block content %}

<section class="customer-form-page">
    <div class="customer-form-wrapper">

        <div class="customer-form-header">
            <div>
                <h2 class="page-title mb-1">Editar cliente</h2>
                <p class="page-subtitle mb-0">Atualize as informações do cliente</p>
            </div>

            <a href="{{ url_for('customers.list_customers') }}" class="btn btn-outline-secondary customer-back-btn">
                Voltar
            </a>
        </div>

        <div class="card border-0 shadow-sm customer-form-card">
            <div class="card-body">
                <form method="POST" class="customer-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3">
                        <div class="col-12">
                            <label for="name" class="form-label">Nome</label>
                            <input
                                type="text"
                                name="name"
                                id="name"
                                class="form-control customer-input"
                                value="{{ form_data.name if form_data else customer.name }}"
                                autocomplete="name"
                                required
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="phone" class="form-label">Telefone</label>
                            <input
                                type="text"
                                name="phone"
                                id="phone"
                                class="form-control customer-input"
                                value="{{ form_data.phone if form_data else (customer.phone or '') }}"
                                inputmode="tel"
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label">E-mail</label>
                            <input
                                type="email"
                                name="email"
                                id="email"
                                class="form-control customer-input"
                                value="{{ form_data.email if form_data else (customer.email or '') }}"
                                autocomplete="email"
                            >
                        </div>
                    </div>

                    <div class="customer-form-actions">
                        <a href="{{ url_for('customers.list_customers') }}" class="btn btn-outline-secondary customer-cancel-btn">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary customer-save-btn">
                            Salvar alterações
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</section>

{% endblock %}
